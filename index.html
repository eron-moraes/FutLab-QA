<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>FutLab QA</title>

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="app">

        <h1>⚽ FutLab QA</h1>

        <form @submit.prevent="addPlayer" data-testid="player-form">

            <!-- GRID DO FORM -->
            <div class="form-grid">

                <!-- Nome -->
                <label>
                    Nome completo
                    <input type="text" v-model="player.name" data-testid="input-name" required />
                </label>

                <!-- Data de nascimento -->
                <label>
                    Data de nascimento
                    <input type="date" v-model="player.birthDate" data-testid="input-birthdate" required />
                </label>

                <!-- Posição -->
                <label>
                    Posição
                    <select v-model="player.position" data-testid="select-position" required>
                        <option value="">Selecione</option>
                        <option v-for="pos in positions" :key="pos" :value="pos">
                            {{ pos }}
                        </option>
                    </select>
                </label>

                <!-- Clube -->
                <label>
                    Clube atual
                    <select v-model="player.team" @change="updateTeamColors" data-testid="select-team" required>
                        <option value="">Selecione um time</option>
                        <option v-for="team in teams" :key="team.name" :value="team">
                            {{ team.name }}
                        </option>
                    </select>
                </label>

                <!-- Altura -->
                <label>
                    Altura (cm)
                    <input type="number" v-model="player.height" min="100" max="230" data-testid="input-height"
                        required />
                </label>

                <!-- Peso -->
                <label>
                    Peso (kg)
                    <input type="number" v-model="player.weight" min="40" max="150" data-testid="input-weight"
                        required />
                </label>

            </div>

            <!-- COR DO TIME -->
            <div class="team-color-wrapper">
                <span>Cor do time</span>
                <div class="team-color" :style="{ backgroundColor: selectedColor }" data-testid="team-color-box"></div>
            </div>

            <!-- PÉ DOMINANTE -->
            <fieldset data-testid="fieldset-foot">
                <legend>Pé dominante</legend>

                <label>
                    <input type="radio" value="Direito" v-model="player.foot" data-testid="radio-foot-right" />
                    Direito
                </label>

                <label>
                    <input type="radio" value="Esquerdo" v-model="player.foot" data-testid="radio-foot-left" />
                    Esquerdo
                </label>
            </fieldset>

            <!-- STATUS -->
            <fieldset data-testid="fieldset-status">
                <legend>Status</legend>

                <label>
                    <input type="radio" value="Ativo" v-model="player.status" data-testid="radio-status-active" />
                    Ativo
                </label>

                <label>
                    <input type="radio" value="Inativo" v-model="player.status" data-testid="radio-status-inactive" />
                    Inativo
                </label>
            </fieldset>

            <!-- BOTÃO -->
            <button type="submit" data-testid="btn-submit">
                Cadastrar Jogador
            </button>

        </form>

    </div>

    <!-- JS -->
    <script src="js/teams.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
